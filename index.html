<!doctype html><html lang='ru'><meta charset='utf-8'>
<title>AI-агент ЛКМ v1.0</title>
<style>
body{margin:0;background:#0d1b2a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.c{background:#16283d;padding:32px;border-radius:16px;width:430px;text-align:center}
img{max-width:220px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#f47a20;color:#fff;border:0}
</style>
<div class=c>
<img src='logo.jpg'><h2>AI-агент расчета расхода ЛКМ v1.0</h2>
<input id=n placeholder='Норма расхода' type=number step=0.001>
<input id=s placeholder='Площадь окраски' type=number step=0.01>
<button onclick='r.textContent="Итог: "+((+n.value||0)*(+s.value||0)).toFixed(3)'>Рассчитать</button>
<h3 id=r>Итог: —</h3></div></html>
