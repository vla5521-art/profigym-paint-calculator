name: container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  NODE_VERSION: 24.18.1

jobs:
  build-scan-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate CI configuration
        run: npm run ci:validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint, typecheck, tests and build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:golden
          npm run test:regression
          npm run test:determinism
          npm run test:security
          npm run build
          npm run verify:template

      - name: Supply-chain checks
        run: |
          npm run security:audit
          npm run security:sbom
          npm run security:licenses
          npm run security:secrets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/profigym-calculator
          tags: |
            type=sha,format=long,prefix=sha-,priority=1000
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }},priority=900

      - name: Select one image reference for scan and smoke
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_ref="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')"
          test -n "$image_ref"
          printf 'ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
          printf '{"imageRef":"%s","digest":"%s","gitSha":"%s"}\n' \
            "$IMAGE_REF" "$IMAGE_DIGEST" "$GITHUB_SHA" > image-evidence.json

      - name: Pull pushed image for local scan and smoke
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE_REF"

      - name: Verify local image is available
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker image inspect "$IMAGE_REF" > /dev/null

      - name: Show Trivy vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Validate Trivy SARIF
        run: |
          test -s trivy-results.sarif
          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0) and
            ([.runs[] | ((.tool.driver.name // "") | length > 0)] | all)
          ' trivy-results.sarif > /dev/null

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-profigym-container

      - name: Enforce Trivy policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Production image smoke
        env:
          PROFIGYM_IMAGE: ${{ steps.image.outputs.ref }}
          PROFIGYM_ENV_FILE: .env.production
        run: |
          cp .env.production.example .env.production
          access_token="$(openssl rand -hex 32)"
          metrics_token="$(openssl rand -hex 32)"
          sed -i \
            -e "s#replace-with-at-least-32-random-bytes#$access_token#" \
            -e "s#replace-with-separate-random-token#$metrics_token#" \
            -e "s#https://example.invalid#http://127.0.0.1:8080#g" \
            .env.production
          docker compose -f compose.yml up -d --no-build
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          APP_PUBLIC_URL=http://127.0.0.1:8080 \
            PROFIGYM_ACCESS_TOKEN="$access_token" \
            PROFIGYM_METRICS_TOKEN="$metrics_token" \
            npm run smoke:production

      - name: Stop smoke environment
        if: always()
        env:
          PROFIGYM_IMAGE: ${{ steps.image.outputs.ref }}
          PROFIGYM_ENV_FILE: .env.production
        run: docker compose -f compose.yml down --remove-orphans --volumes || true

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-container-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/security
            diagnostic-reports
            trivy-results.sarif
            image-digest.txt
            image-evidence.json
