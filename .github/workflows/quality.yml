name: quality
on: [push, pull_request]
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-results, path: diagnostic-reports/unit-results.json }
  golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fixtures:golden && npm run test:golden && npm run test:regression && npm run test:determinism
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: golden-regression, path: diagnostic-reports }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:security && npm run test:concurrency && npm run db:restore:test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: security-results, path: diagnostic-reports }
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fixtures:golden && npm run e2e:chromium && npm run e2e:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright, path: |
            artifacts/e2e
            playwright-report
            test-results }
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fixtures:golden && BENCHMARK_ITERATIONS=3 npm run benchmark:full && npm run test:memory && CI=1 npm run test:soak
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: performance-results, path: diagnostic-reports }
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build && npm run verify:template
