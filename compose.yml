name: profigym
services:
  proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROFIGYM_HTTP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50
    security_opt: [no-new-privileges:true]
  app:
    image: "${PROFIGYM_IMAGE:-profigym-calculator:sha-local}"
    build:
      context: .
      args:
        VCS_REF: "${IMAGE_VCS_REF:-local}"
    command: ["node", "server/index.js"]
    env_file: ["${PROFIGYM_ENV_FILE:-.env.production}"]
    environment:
      NODE_ENV: production
      CAD_PROCESSING_MODE: queue
      CAD_WORKER_REQUIRED: "true"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp/cad-processing:size=256m,mode=0700,uid=1000,gid=1000
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000
    volumes:
      - database:/data/database
      - source-files:/data/source-files
      - viewer-mesh:/data/viewer-mesh
      - previews:/data/previews
      - reports:/data/reports
      - backups:/data/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6
    stop_grace_period: 30s
    pids_limit: 150
    mem_limit: 768m
    cpus: 1.00
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    image: "${PROFIGYM_IMAGE:-profigym-calculator:sha-local}"
    build:
      context: .
      args:
        VCS_REF: "${IMAGE_VCS_REF:-local}"
    command: ["node", "server/worker.js"]
    env_file: ["${PROFIGYM_ENV_FILE:-.env.production}"]
    environment:
      NODE_ENV: production
      CAD_PROCESSING_MODE: queue
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp/cad-processing:size=512m,mode=0700,uid=1000,gid=1000
      - /tmp:size=32m,mode=0700,uid=1000,gid=1000
    volumes:
      - database:/data/database
      - source-files:/data/source-files
      - viewer-mesh:/data/viewer-mesh
      - previews:/data/previews
      - reports:/data/reports
      - backups:/data/backups
    stop_grace_period: 45s
    pids_limit: 200
    mem_limit: 1536m
    cpus: 2.00
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  backup:
    image: "${PROFIGYM_IMAGE:-profigym-calculator:sha-local}"
    command: ["sh", "-c", "while true; do node server/backup-cli.js; sleep ${CAD_BACKUP_INTERVAL_SECONDS:-86400}; done"]
    env_file: ["${PROFIGYM_ENV_FILE:-.env.production}"]
    profiles: [backup]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=32m]
    volumes:
      - database:/data/database
      - backups:/data/backups
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    security_opt: [no-new-privileges:true]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token:/run/secrets/metrics_token:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100
    security_opt: [no-new-privileges:true]
  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/profigym-dashboard.json:/var/lib/grafana/dashboards/profigym-dashboard.json:ro
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100
    security_opt: [no-new-privileges:true]
  clamav:
    image: clamav/clamav:1.4.3
    profiles: [antivirus]
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.00
    pids_limit: 200
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  database:
  source-files:
  viewer-mesh:
  previews:
  reports:
  backups:
  clamav-db:
