services:
  proxy:
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    ports:
      - "80:8080"
      - "443:8443"
  app:
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }
        reservations: { cpus: "0.25", memory: 256M }
  worker:
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1536M }
        reservations: { cpus: "0.50", memory: 512M }
